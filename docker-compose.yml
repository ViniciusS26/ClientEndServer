version: '3.9'

services:
  servertcp:
    build: 
      context: ./src
      dockerfile: conexao_TCP/Dockerfile
    container_name: server_tcp
    volumes:
      - ./src:/app
    environment:
      - PYTHONPATH=/app
    command: python3 /app/conexao_TCP/new_server.py
    networks:
      redes:
        ipv4_address: 95.58.0.3
    ports:
      - "8000:80"


  client:
    build:
      context: ./src
      dockerfile: conexao_TCP/Dockerfile
    container_name: client
    depends_on:
      - servertcp
    volumes:
      - ./capturas:/capturas
      - ./src:/app
    environment:
      - PYTHONPATH=/app
    command: python3 /app/conexao_TCP/new_client.py
    networks:
      redes:
        ipv4_address: 95.58.0.4

networks:
  redes:
    driver: bridge
    ipam:
      config:
        - subnet: 95.58.0.0/24